services:
  - type: web
    name: lindice-site
    runtime: static
    rootDir: site
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
  - type: web
    name: lindice-app
    runtime: python
    region: virginia
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,app.lindice.com.br"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://app.lindice.com.br"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "3600"
      - key: PUBLIC_SITE_URL
        sync: false
      - key: ANDROID_APP_PACKAGE_ID
        sync: false
      - key: ANDROID_SHA256_CERT_FINGERPRINTS
        sync: false
      - key: STORE_CONTACT_EMAIL
        value: "lindicecalcados@gmail.com"
      - key: STORE_RESPONSIBLE_NAME
        value: "Fabrício Pereira da Silva Alves"
      - key: STORE_PIX_KEY
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_ACCOUNT_URL
        sync: false
      - key: CARD_PAYMENT_ENABLED
        value: "true"
      - key: SHOE_SUPPLIER_CATALOG_URL
        sync: false
      - key: SHOE_SUPPLIER_CATALOG_FORMAT
        value: "csv"
      - key: PHONE_VERIFICATION_REQUIRED
        value: "false"
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_ENDPOINT_URL
        sync: false
      - key: SUPABASE_STORAGE_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
  - type: cron
    name: lindice-expurgo-contas
    runtime: python
    region: virginia
    plan: starter
    schedule: "0 6 * * *"
    buildCommand: "bash build.sh"
    startCommand: "python manage.py purge_deleted_accounts"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,app.lindice.com.br"
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_ENDPOINT_URL
        sync: false
      - key: SUPABASE_STORAGE_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
