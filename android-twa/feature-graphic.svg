<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A52A8"/>
      <stop offset="50%" stop-color="#4D63B7"/>
      <stop offset="100%" stop-color="#6B7FC9"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Circles decorativas -->
  <circle cx="920" cy="80" r="320" fill="white" fill-opacity="0.05"/>
  <circle cx="160" cy="440" r="200" fill="white" fill-opacity="0.05"/>
  <circle cx="420" cy="120" r="120" fill="white" fill-opacity="0.06"/>

  <!-- Divisor -->
  <line x1="440" y1="80" x2="440" y2="420" stroke="white" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Logo box -->
  <rect x="72" y="170" width="110" height="110" rx="22" fill="white"/>
  <text x="127" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" font-style="italic" fill="#4D63B7">L</text>

  <!-- Nome e tagline -->
  <text x="208" y="250" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-1">Líndice</text>
  <text x="210" y="290" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="white" fill-opacity="0.80">Calçados, bolsas e acessórios femininos</text>

  <!-- Pills lado direito -->
  <!-- Catálogo de calçados -->
  <rect x="472" y="100" width="280" height="48" rx="24" fill="white" fill-opacity="0.14" stroke="white" stroke-opacity="0.30" stroke-width="1.5"/>
  <circle cx="500" cy="124" r="5" fill="white"/>
  <text x="518" y="129" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="white">Catálogo de calçados</text>

  <!-- Compra pelo app -->
  <rect x="472" y="162" width="240" height="48" rx="24" fill="white" fill-opacity="0.14" stroke="white" stroke-opacity="0.30" stroke-width="1.5"/>
  <circle cx="500" cy="186" r="5" fill="white"/>
  <text x="518" y="191" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="white">Compra pelo app</text>

  <!-- Crediário digital -->
  <rect x="472" y="224" width="240" height="48" rx="24" fill="white" fill-opacity="0.14" stroke="white" stroke-opacity="0.30" stroke-width="1.5"/>
  <circle cx="500" cy="248" r="5" fill="white"/>
  <text x="518" y="253" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="white">Crediário digital</text>

  <!-- Acompanhe seu pedido -->
  <rect x="472" y="286" width="280" height="48" rx="24" fill="white" fill-opacity="0.14" stroke="white" stroke-opacity="0.30" stroke-width="1.5"/>
  <circle cx="500" cy="310" r="5" fill="white"/>
  <text x="518" y="315" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="white">Acompanhe seu pedido</text>

  <!-- Entrega no seu endereço -->
  <rect x="472" y="348" width="290" height="48" rx="24" fill="white" fill-opacity="0.14" stroke="white" stroke-opacity="0.30" stroke-width="1.5"/>
  <circle cx="500" cy="372" r="5" fill="white"/>
  <text x="518" y="377" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="white">Entrega no seu endereço</text>
