{% extends "accounts/base.html" %}

{% block content %}
<div class="reg-wizard">
    <h1 class="reg-question">Esqueci minha senha</h1>
    <p class="reg-hint">Digite o e-mail da sua conta. Vamos enviar um link para você criar uma nova senha.</p>

    <form method="post">
        {% csrf_token %}
        <p>
            <label for="{{ form.email.id_for_label }}">E-mail</label>
            {{ form.email }}
            {{ form.email.errors }}
        </p>
        <button type="submit">Enviar link de redefinição</button>
    </form>

    <p class="reg-foot"><a href="{% url 'login' %}">Voltar para entrar</a></p>
</div>
{% endblock %}
