{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4d63b7">
    <title>Líndice</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'accounts/lindice-icon.svg' %}">
    <link rel="manifest" href="{% static 'accounts/site.webmanifest' %}">
    <style>
        :root {
            --brand-blue: #4d63b7;
            --brand-purple: #7a2d84;
            --brand-mist: #9fb5ca;
            --ink: #182230;
            --muted: #5f6c7b;
            --line: #d9e2ec;
            --surface: #ffffff;
            --page: #f4f6f8;
            --success: #0f766e;
            --danger: #b42318;
            --shadow: 0 18px 48px rgba(24, 34, 48, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(180deg, rgba(77, 99, 183, 0.07), rgba(244, 246, 248, 0) 260px),
                var(--page);
            color: var(--ink);
            line-height: 1.5;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 255, 255, 0.96);
            color: var(--brand-blue);
            padding: 16px 32px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 960px;
            margin: 0 auto;
            font-size: 28px;
            font-weight: 700;
        }

        .brand-logo {
            position: relative;
            width: 42px;
            height: 42px;
            flex: 0 0 auto;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
            box-shadow: 0 8px 18px rgba(77, 99, 183, 0.12);
        }

        .brand-logo span {
            position: absolute;
            display: block;
            border-radius: 2px;
        }

        .brand-logo .logo-one {
            left: 10px;
            top: 8px;
            width: 7px;
            height: 26px;
            background: var(--brand-blue);
        }

        .brand-logo .logo-two {
            left: 10px;
            top: 28px;
            width: 24px;
            height: 6px;
            background: var(--brand-blue);
        }

        .brand-logo .logo-three {
            left: 19px;
            top: 21px;
            width: 15px;
            height: 5px;
            background: var(--brand-purple);
        }

        .brand-logo .logo-four {
            left: 27px;
            top: 14px;
            width: 7px;
            height: 5px;
            background: var(--brand-mist);
        }

        .brand-name {
            color: var(--brand-blue);
        }

        main {
            max-width: 960px;
            margin: 40px auto;
            padding: 32px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        h1,
        h2,
        h3 {
            letter-spacing: 0;
            line-height: 1.18;
        }

        h1 {
            margin: 0 0 22px;
            font-size: 34px;
        }

        h2 {
            margin: 30px 0 14px;
            font-size: 24px;
        }

        h3 {
            margin: 22px 0 10px;
            font-size: 18px;
        }

        p {
            color: var(--muted);
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: 700;
            color: var(--ink);
        }

        input,
        textarea,
        select {
            width: 100%;
            margin-top: 6px;
            padding: 12px 13px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            background: #ffffff;
            color: var(--ink);
            font: inherit;
        }

        textarea {
            min-height: 112px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--brand-blue);
            box-shadow: 0 0 0 3px rgba(77, 99, 183, 0.16);
            outline: none;
        }

        button,
        .button {
            display: inline-block;
            margin-top: 18px;
            min-height: 42px;
            padding: 11px 16px;
            border: 0;
            border-radius: 6px;
            background: var(--brand-blue);
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        button:hover,
        .button:hover {
            background: var(--brand-purple);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .button-secondary {
            border: 1px solid var(--brand-blue);
            background: #ffffff;
            color: var(--brand-blue);
        }

        .button-secondary:hover {
            background: #eef2ff;
            color: var(--brand-purple);
        }

        a {
            color: var(--brand-blue);
            font-weight: 700;
        }

        a:hover {
            color: var(--brand-purple);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid var(--line);
            text-align: left;
        }

        th {
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
        }

        .errorlist,
        .messages {
            color: var(--danger);
        }

        .messages {
            padding: 12px 14px;
            border: 1px solid #fecdca;
            border-radius: 6px;
            background: #fffbfa;
            list-style-position: inside;
        }

        .carousel {
            margin: 20px 0;
        }

        .carousel-item {
            display: none;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fbfcfe;
        }

        .carousel-item.active {
            display: block;
        }

        .carousel-item img {
            display: block;
            max-width: 100%;
            max-height: 420px;
            object-fit: contain;
            margin: 12px 0;
            border-radius: 8px;
        }

        .purchase {
            margin-top: 24px;
            padding: 20px;
            border: 1px solid var(--line);
            border-left: 5px solid var(--brand-mist);
            border-radius: 8px;
            background: #ffffff;
        }

        .purchase h3 {
            margin-top: 0;
        }

        .purchase-meta {
            color: var(--muted);
            margin-bottom: 12px;
        }

        .product-form {
            margin-top: 18px;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fbfcfe;
        }

        .product-form h3 {
            margin-top: 0;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .profile-photo-preview {
            width: 180px;
            height: 180px;
            margin: 0 0 22px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fbfcfe;
        }

        .profile-photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .profile-photo-small {
            width: 88px;
            height: 88px;
        }

        .info-panel {
            margin-top: 22px;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fbfcfe;
        }

        .info-panel h2 {
            margin-top: 0;
        }

        .info-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px 22px;
            margin: 0;
        }

        .info-list div {
            min-width: 0;
        }

        .info-list dt {
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .info-list dd {
            margin: 4px 0 0;
        }

        .brand-preview {
            display: flex;
            gap: 32px;
            align-items: center;
            padding: 36px 0;
        }

        .brand-preview h1 {
            margin: 0;
            font-size: 72px;
            line-height: 1;
        }

        .brand-preview-title {
            color: #4d63b7;
        }

        .brand-preview p {
            color: #52606d;
            font-size: 22px;
        }

        .brand-preview-logo {
            position: relative;
            width: 128px;
            height: 128px;
            flex: 0 0 auto;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: #ffffff;
            overflow: hidden;
        }

        .step {
            position: absolute;
            display: block;
            border-radius: 4px;
        }

        .step-one {
            left: 30px;
            top: 24px;
            width: 18px;
            height: 76px;
            background: var(--brand-blue);
        }

        .step-two {
            left: 30px;
            top: 82px;
            width: 70px;
            height: 18px;
            background: var(--brand-blue);
        }

        .step-three {
            left: 54px;
            top: 62px;
            width: 46px;
            height: 14px;
            background: var(--brand-purple);
        }

        .step-four {
            left: 76px;
            top: 42px;
            width: 24px;
            height: 14px;
            background: var(--brand-mist);
        }

        .brand-preview-line {
            width: 360px;
            height: 12px;
            margin: 20px 0;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--brand-mist), var(--brand-blue), var(--brand-purple));
        }

        .swatches {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .swatches span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 132px;
            height: 54px;
            border-radius: 6px;
            color: #ffffff;
            font-weight: 700;
        }

        @media (max-width: 640px) {
            .topbar {
                padding: 12px 18px;
            }

            .brand {
                font-size: 24px;
            }

            .brand-logo {
                width: 38px;
                height: 38px;
                border-radius: 9px;
            }

            .brand-logo .logo-one {
                left: 9px;
                top: 7px;
                width: 6px;
                height: 24px;
            }

            .brand-logo .logo-two {
                left: 9px;
                top: 26px;
                width: 22px;
            }

            .brand-logo .logo-three {
                left: 17px;
                top: 20px;
                width: 14px;
            }

            .brand-logo .logo-four {
                left: 25px;
                top: 13px;
                width: 6px;
            }

            main {
                width: calc(100% - 24px);
                max-width: none;
                margin: 16px auto;
                padding: 22px 18px;
                border-radius: 8px;
            }

            h1 {
                font-size: 30px;
                line-height: 1.15;
            }

            h2 {
                font-size: 24px;
                line-height: 1.2;
            }

            button,
            .button {
                width: 100%;
                min-height: 44px;
                padding: 12px 16px;
                text-align: center;
            }

            .action-row {
                display: block;
            }

            .info-list {
                grid-template-columns: 1fr;
            }

            table {
                display: block;
                max-width: 100%;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            th,
            td {
                min-width: 110px;
                vertical-align: top;
            }

            .purchase {
                padding: 16px 14px;
                overflow: hidden;
            }

            .purchase-meta {
                line-height: 1.45;
            }

            .brand-preview {
                display: block;
                padding: 12px 0;
            }

            .brand-preview h1 {
                margin-top: 18px;
                font-size: 48px;
            }

            .brand-preview p {
                font-size: 18px;
            }

            .brand-preview-line {
                width: 100%;
            }

            .swatches span {
                width: calc(50% - 6px);
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-logo" aria-hidden="true">
                <span class="logo-one"></span>
                <span class="logo-two"></span>
                <span class="logo-three"></span>
                <span class="logo-four"></span>
            </span>
            <span class="brand-name">Líndice</span>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
