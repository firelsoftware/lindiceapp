{% extends "accounts/base.html" %}

{% block content %}
<h1>Cadastrar produto</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar produto</button>
</form>

<p><a href="{% url 'product_list' %}">Voltar para produtos</a></p>
{% endblock %}
